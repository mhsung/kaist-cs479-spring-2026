site_name: CS479 Machine Learning for 3D Data (KAIST, Spring 2026)

theme:
  name: material
  icon:
    logo: material/cube-outline
  features:
    - navigation.tabs
    - navigation.tabs.sticky

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - footnotes
  - meta
  - tables
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - macros

copyright: Copyright &copy; 2026 Minhyuk Sung

nav:
  - Home: index.md
  - Programming Assignments: programming-assignments.md
  - Exams: exams.md
  - 3D Segmentation Competition: 3d-segmentation-competition.md
  - 3D Rendering Contest: 3d-rendering-contest.md
  - Guest Lecture 1: guest-lecture-clement-jambon.md
  - Guest Lecture 2: guest-lecture-qixing-huang.md

